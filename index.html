<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>음성 주문 만족도 설문</title>
<meta name="robots" content="noindex">
<style>
  :root { --brand:#5b5bd6; --bg:#f7f7fb; --text:#1a1a2e; --sub:#6b6b80; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
         background:var(--bg); color:var(--text); min-height:100dvh;
         display:flex; flex-direction:column; align-items:center; padding:24px 20px; }
  .card { width:100%; max-width:420px; }
  h1 { font-size:22px; line-height:1.35; margin:28px 0 12px; }
  p.desc { font-size:15px; line-height:1.6; color:var(--sub); margin-bottom:8px; }
  ul.steps { list-style:none; margin:20px 0; }
  ul.steps li { font-size:14.5px; line-height:1.5; padding:10px 0 10px 34px; position:relative; color:var(--text); }
  ul.steps li::before { content:attr(data-n); position:absolute; left:0; top:8px; width:24px; height:24px;
     border-radius:50%; background:var(--brand); color:#fff; font-size:12.5px; font-weight:700;
     display:flex; align-items:center; justify-content:center; }
  .hint { font-size:13px; color:var(--sub); background:#ececf6; border-radius:10px; padding:12px 14px; line-height:1.55; margin:16px 0 24px; }
  .widget-wrap { width:100%; display:flex; justify-content:center; }
  elevenlabs-convai { width:100%; }
  footer { margin-top:auto; padding-top:32px; font-size:12px; color:#a0a0b2; }
</style>
</head>
<body>
<div class="card">
  <h1>음성 주문, 요즘 어떠세요?<br>90초만 여쭤볼게요 🎙️</h1>
  <p class="desc">버튼을 누르면 AI 상담원이 음성으로 세 가지를 여쭤봅니다. 평소 말씀하시듯 편하게 답해 주시면 됩니다.</p>
  <ul class="steps">
    <li data-n="1">아래 <b>통화 시작</b> 버튼 누르기</li>
    <li data-n="2">마이크 권한 <b>허용</b> 하기</li>
    <li data-n="3">질문 3개에 말로 답하기 (약 90초)</li>
  </ul>
  <div class="hint">🔊 소리가 나오니 통화 가능한 환경에서 참여해 주세요. 답변은 서비스 개선 목적으로만 사용됩니다.</div>
  <div class="widget-wrap">
    <elevenlabs-convai
      agent-id="agent_2301m0v1b7ghftjbvhw27j7fph3e"
      variant="expanded"
      action-text="준비되셨으면 시작해 주세요"
      start-call-text="통화 시작"
      end-call-text="종료"
      listening-text="듣고 있어요…"
      speaking-text="말하는 중…"></elevenlabs-convai>
  </div>
  <footer>Channel Talk · Voice Order Survey</footer>
</div>
<script>
  // ?rid= 응답자 식별자를 위젯 dynamic-variables로 전달 (트래킹 용도)
  (function () {
    var rid = new URLSearchParams(location.search).get("rid") || "direct";
    var w = document.querySelector("elevenlabs-convai");
    w.setAttribute("dynamic-variables", JSON.stringify({ rid: rid }));
  })();
</script>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
</body>
</html>
