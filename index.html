<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>채널카페 보이스 설문</title>
<meta name="robots" content="noindex">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
         background:#fafafa; color:#1a1a2e; overflow:hidden; }
  .stage { position:fixed; inset:0; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:28px; padding:24px; }
  .hidden { display:none !important; }

  .orb { width:170px; height:170px; border-radius:50%; cursor:pointer; border:none; flex-shrink:0;
     background:radial-gradient(circle at 35% 30%, #cfd6ff, #7b87f5 55%, #4a56d8);
     transition:transform .12s ease-out, box-shadow .4s ease, opacity .6s ease;
     box-shadow:0 0 50px rgba(120,130,245,.45); }
  .orb.speaking { animation:breathe 2.2s ease-in-out infinite; }
  .orb.thinking { animation:think 1.1s ease-in-out infinite; }
  @keyframes think {
    0%,100% { transform:scale(1); opacity:1; }
    50%     { transform:scale(.95); opacity:.75; }
  }
  @keyframes breathe {
    0%,100% { box-shadow:0 0 40px rgba(120,130,245,.4); transform:scale(1); }
    50%     { box-shadow:0 0 85px rgba(120,130,245,.75); transform:scale(1.06); }
  }

  #tapHint { font-size:15px; color:rgba(26,26,46,.45); }
  #aiCaption { font-size:16px; line-height:1.6; color:rgba(26,26,46,.6);
     text-align:center; max-width:340px; min-height:52px; }
  #sttText { position:fixed; left:24px; right:24px; bottom:max(48px, env(safe-area-inset-bottom, 48px));
     text-align:center; font-size:19px; line-height:1.55; font-weight:600; color:#1a1a2e;
     opacity:0; transition:opacity .35s ease; }
  #sttText.show { opacity:1; }
  #errText { font-size:14px; color:#ff8a80; text-align:center; max-width:320px; line-height:1.5; }
  #doneText { font-size:20px; font-weight:600; text-align:center; line-height:1.7; }
</style>
</head>
<body>
  <div id="introStage" class="stage">
    <button id="orbStart" class="orb" aria-label="설문 시작"></button>
    <div id="tapHint">탭해서 시작</div>
    <div id="errText" class="hidden"></div>
  </div>

  <div id="callStage" class="stage hidden">
    <div id="orb" class="orb"></div>
    <div id="aiCaption"></div>
  </div>

  <div id="doneStage" class="stage hidden">
    <div id="doneText">감사합니다 🙏</div>
  </div>

  <div id="sttText"></div>

<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";

const AGENT_ID = "agent_2301m0v1b7ghftjbvhw27j7fph3e";
const uid = new URLSearchParams(location.search).get("uid") || "direct";
const $ = (id) => document.getElementById(id);

let conv = null, meterTimer = null, sttFadeTimer = null, myMode = "listening";

function show(stage) {
  ["introStage","callStage","doneStage"].forEach(s => $(s).classList.toggle("hidden", s!==stage));
}

function setMode(mode) {
  myMode = mode;
  voiceTicks = 0; quietTicks = 0;
  $("orb").classList.toggle("speaking", mode === "speaking");
  $("orb").classList.remove("thinking");
  if (mode === "speaking") $("orb").style.transform = "";
}

// 내 STT: 박스 없이 하단에 떴다가 사라짐
function showStt(text, final) {
  clearTimeout(sttFadeTimer);
  const el = $("sttText");
  el.textContent = text;
  el.classList.add("show");
  if (final) sttFadeTimer = setTimeout(() => el.classList.remove("show"), 2000);
}
function hideStt() {
  clearTimeout(sttFadeTimer);
  $("sttText").classList.remove("show");
}

// 듣는 중엔 목소리 크기에 따라 오브가 반응
let voiceTicks = 0, quietTicks = 0;
function startMeter() {
  meterTimer = setInterval(() => {
    if (!conv || myMode !== "listening") return;
    let v = 0; try { v = conv.getInputVolume(); } catch(_){}
    const orb = $("orb");
    if (v > 0.12) {
      voiceTicks++; quietTicks = 0;
      orb.classList.remove("thinking");
      orb.style.transform = `scale(${1 + Math.min(v * 0.55, 0.22)})`;
    } else {
      quietTicks++;
      // 말하다가 조용해지면 즉시 '생각 중'으로 전환 (인라인 transform이 애니메이션을 덮지 않게 제거)
      if (voiceTicks >= 3 && quietTicks >= 5 && !orb.classList.contains("thinking")) {
        voiceTicks = 0;
        orb.style.transform = "";
        orb.classList.add("thinking");
      } else if (!orb.classList.contains("thinking")) {
        orb.style.transform = "scale(1)";
      }
    }
  }, 80);
}

// 브라우저 음성인식으로 말하는 즉시 표시 (지원 브라우저에서만)
let rec = null;
function startLiveStt() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  rec = new SR();
  rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => {
    let txt = "";
    for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
    if (txt.trim() && myMode === "listening") showStt(txt.trim(), false);
  };
  rec.onend = () => { if (conv) try { rec.start(); } catch(_){} };
  try { rec.start(); } catch(_){}
}
function stopLiveStt() { if (rec) { rec.onend = null; try { rec.stop(); } catch(_){} rec = null; } }

async function start() {
  $("errText").classList.add("hidden");
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    $("errText").textContent = "마이크 권한이 필요해요. 브라우저 설정에서 허용한 뒤 다시 탭해 주세요.";
    $("errText").classList.remove("hidden");
    return;
  }
  show("callStage");
  setMode("listening");
  try {
    const wantRtc = new URLSearchParams(location.search).get("rtc") !== "0";
    const opts = (ct) => ({
      agentId: AGENT_ID,
      connectionType: ct,
      dynamicVariables: { uid },
      onModeChange: ({ mode }) => setMode(mode),
      onMessage: ({ source, message }) => {
        console.log("[EVT]", source, message);
        if (source === "ai") { $("aiCaption").textContent = message; hideStt(); $("orb").classList.remove("thinking"); }
        else if (source === "user") { showStt(message, true); if (myMode === "listening") { $("orb").style.transform = ""; $("orb").classList.add("thinking"); } }
      },
      onDisconnect: () => finish(),
      onError: (m) => console.warn("conv error:", m),
    });
    try {
      conv = await Conversation.startSession(opts(wantRtc ? "webrtc" : "websocket"));
      console.log("[CONN]", wantRtc ? "webrtc" : "websocket");
    } catch (e) {
      console.log("[CONN] webrtc failed, fallback websocket", e?.message || e);
      conv = await Conversation.startSession(opts("websocket"));
    }
    startMeter();
    startLiveStt();
  } catch (e) {
    show("introStage");
    $("errText").textContent = "연결에 실패했어요. 잠시 후 다시 탭해 주세요.";
    $("errText").classList.remove("hidden");
  }
}

$("orbStart").onclick = start;
if (new URLSearchParams(location.search).get("auto") === "1") setTimeout(start, 600);

function finish() {
  stopLiveStt();
  clearInterval(meterTimer);
  hideStt();
  conv = null;
  show("doneStage");
}
</script>
</body>
</html>
